name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build the app bundle
        run: ./build.sh

      - name: Check that every string is localized
        run: ./tools/check-localization.sh

      - name: Pack the disk image
        run: ./tools/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: WashMyMac.dmg
          path: dist/*.dmg
